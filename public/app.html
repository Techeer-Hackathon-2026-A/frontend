<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* 스캔 화면 바깥 흐름 프로토타입 (docs/PLAN.md). 토큰은 demo/index.html 과 같다.
     코드관리 UX: Vercel(가져오기·설정·배포 목록), GitHub(Files changed), Snyk·VS Code(3단 체크 트리), Linear(사이드바·⌘K) */
  :root {
    --bg: #08090a;
    --panel: #0e0f11;
    --panel-2: #16171a;
    --panel-3: #1d1e22;
    --border: rgba(255, 255, 255, .07);
    --border-2: rgba(255, 255, 255, .13);
    --text: #f7f8f8;
    --muted: #8a8f98;
    --dim: #6b7079;
    --faint: #4d5157;
    --red: #ff5a52;
    --red-bg: rgba(255, 90, 82, .09);
    --amber: #f2c94c;
    --green: #4cb782;
    --green-bg: rgba(76, 183, 130, .09);
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  kbd { font: 11px var(--mono); color: var(--dim); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; line-height: 17px; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--mono); font-variant-ligatures: none; }
  .muted { color: var(--muted); } .dim { color: var(--dim); }
  .red { color: var(--red); } .green { color: var(--green); }

  /* 앱 프레임 (Linear) */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100vh; }
  .side { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; border-right: 1px solid var(--border); min-height: 0; }
  .ws { display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 8px; border-radius: 7px; font-weight: 500; position: relative; }
  .ws:hover { background: var(--panel-2); }
  .ws .chev { margin-left: auto; color: var(--dim); }
  .av { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font: 600 11px Inter; color: #08090a; flex: none; }
  .search { display: flex; align-items: center; gap: 8px; height: 30px; margin: 6px 0 10px; padding: 0 8px 0 10px; border: 1px solid var(--border); border-radius: 7px; color: var(--dim); background: var(--panel); }
  .search:hover { border-color: var(--border-2); color: var(--muted); }
  .search kbd { margin-left: auto; }
  .nav { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 6px; color: var(--muted); }
  .nav:hover { background: var(--panel-2); color: var(--text); }
  .nav.on { background: var(--panel-2); color: var(--text); }
  .nav .n { margin-left: auto; font-size: 11.5px; color: var(--dim); }
  .side h6 { font: 500 11.5px Inter; color: var(--dim); padding: 16px 10px 6px; }
  .side .grow { flex: 1; }
  .me { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-top: 1px solid var(--border); margin: 6px -8px -10px; padding: 12px 18px; color: var(--muted); }
  .me img, .me .av { border-radius: 50%; }

  .main { display: grid; grid-template-rows: 52px minmax(0, 1fr); min-width: 0; min-height: 0; }
  .top { display: flex; align-items: center; gap: 8px; padding: 0 24px; border-bottom: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .top a:hover { color: var(--text); }
  .top .sep { color: var(--faint); }
  .top b { color: var(--text); font-weight: 500; }
  .top .mlogo { display: none; }
  .scroll { overflow: auto; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 36px 32px 96px; }
  .wrap.narrow { max-width: 980px; }

  /* 공통 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border-2); font-weight: 500; white-space: nowrap; transition: background .15s, transform .15s, opacity .15s; }
  .btn:hover { background: var(--panel-2); }
  .btn.sm { height: 28px; padding: 0 11px; font-size: 12.5px; }
  .btn.primary { background: var(--text); color: var(--bg); border-color: transparent; }
  .btn.primary:hover { transform: translateY(-1px); background: #fff; }
  .btn.primary kbd { color: #6b7079; border-color: rgba(0,0,0,.15); }
  .btn.ok { background: var(--green); color: #04130b; border-color: transparent; }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .chip.red { background: var(--red-bg); color: var(--red); }
  .chip.green { background: var(--green-bg); color: var(--green); }
  .chip.gray { background: var(--panel-2); color: var(--muted); }
  .tag { font: 10.5px/16px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; display: inline-block; }
  .pulse { animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--faint); border-top-color: var(--text); animation: spin .8s linear infinite; flex: none; }
  .page > * { animation: rise .35s cubic-bezier(.2,.7,.2,1) both; }
  .page > *:nth-child(2) { animation-delay: .04s; } .page > *:nth-child(3) { animation-delay: .08s; } .page > *:nth-child(4) { animation-delay: .12s; }
  .lang { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .lang i { width: 8px; height: 8px; border-radius: 50%; }
  .badge-n { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font: 600 10px/16px Inter; text-align: center; }
  .private { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; line-height: 16px; }

  .head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 28px; }
  .head h1 { font-size: 24px; font-weight: 500; letter-spacing: -.02em; }
  .head p { color: var(--muted); margin-top: 4px; font-size: 13.5px; }
  .head .sp { flex: 1; }
  h2 { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  h2 .n { color: var(--dim); font-weight: 400; }
  section + section { margin-top: 40px; }
  .sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sec-head .sp { flex: 1; }

  /* 대시보드 */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .stat { background: var(--bg); padding: 18px 18px 16px; }
  .stat .v { font-size: 32px; line-height: 1; font-weight: 500; letter-spacing: -.035em; font-feature-settings: 'tnum'; }
  .stat .v small { font-size: 15px; color: var(--dim); letter-spacing: 0; margin-left: 2px; }
  .stat .l { margin-top: 10px; color: var(--text); font-size: 12.5px; }
  .stat .s { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .list { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--border); transition: background .12s; }
  .row:first-child { border-top: 0; }
  a.row:hover, .row.click:hover { background: var(--panel); cursor: pointer; }
  .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
  .ico.red { background: var(--red-bg); color: var(--red); }
  .ico.green { background: var(--green-bg); color: var(--green); }
  .row .t { font-size: 13.5px; font-weight: 500; }
  .row .t .o { color: var(--muted); font-weight: 400; }
  .row .s { color: var(--dim); font-size: 12.5px; margin-top: 1px; }
  .row .grow { flex: 1; min-width: 0; }

  .seg { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  .seg button { height: 24px; padding: 0 10px; border-radius: 6px; color: var(--muted); font-size: 12.5px; }
  .seg button.on { background: var(--panel-3); color: var(--text); box-shadow: 0 0 0 1px var(--border); }
  .field { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; width: 240px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--dim); }
  .field:focus-within { border-color: var(--border-2); }
  .field input { flex: 1; min-width: 0; color: var(--text); }
  .field input::placeholder { color: var(--dim); }

  .table .tr, .table .th { display: grid; grid-template-columns: minmax(0, 1fr) 120px 190px 92px 68px; align-items: center; gap: 12px; padding: 0 16px; }
  .table .th { height: 34px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--border); }
  .table .tr { height: 52px; border-top: 1px solid var(--border); cursor: pointer; transition: background .12s; }
  .table .th + .tr { border-top: 0; }
  .table .tr:hover { background: var(--panel); }
  .table .tr:hover .act { opacity: 1; }
  .table .act { opacity: .55; transition: opacity .12s; justify-self: end; }
  .rname { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13.5px; }
  .rname span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rname .o { color: var(--muted); }
  .st { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .empty { padding: 40px 16px; display: grid; justify-items: center; gap: 10px; color: var(--muted); text-align: center; }

  /* 새 스캔 */
  .steps { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; color: var(--dim); font-size: 12.5px; }
  .steps span { display: inline-flex; align-items: center; gap: 7px; }
  .steps span i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border-2); display: grid; place-items: center; font: 500 10.5px Inter; font-style: normal; }
  .steps span.on { color: var(--text); } .steps span.on i { background: var(--text); color: var(--bg); border-color: transparent; }
  .steps span.done i { background: var(--panel-3); color: var(--green); border-color: transparent; }
  .steps .ln { width: 28px; height: 1px; background: var(--border-2); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .card-h { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid var(--border); }
  .card-h .field { flex: 1; width: auto; }
  .pick { position: relative; }
  .pick > button { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); font-weight: 500; }
  .pick > button:hover { border-color: var(--border-2); }
  .menu { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 220px; padding: 5px; background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.5); animation: rise .15s both; }
  .menu button { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 9px; border-radius: 6px; text-align: left; }
  .menu button:hover { background: var(--panel-3); }
  .menu .ck { margin-left: auto; color: var(--text); }
  .menu .meta { margin-left: auto; color: var(--dim); font: 11.5px var(--mono); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px -5px; }
  .irow { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; height: 56px; border-top: 1px solid var(--border); }
  .irow:first-child { border-top: 0; }
  .irow:hover { background: rgba(255,255,255,.015); }
  .irow .grow { flex: 1; min-width: 0; }
  .irow .t { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 13.5px; }
  .irow .s { color: var(--dim); font-size: 12px; margin-top: 1px; display: flex; gap: 8px; }
  .card-f { padding: 12px 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12.5px; }
  .card-f a { color: var(--muted); } .card-f a:hover { color: var(--text); }
  .how { padding: 22px 20px; }
  .how .fig { width: 64px; height: 60px; margin-bottom: 14px; }
  .how h3 { font-size: 15px; font-weight: 500; letter-spacing: -.01em; }
  .how ol { list-style: none; margin: 16px 0 0; display: grid; gap: 14px; }
  .how li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
  .how li i { width: 22px; height: 22px; border-radius: 6px; background: var(--panel-2); display: grid; place-items: center; font: 500 11px var(--mono); color: var(--muted); font-style: normal; }
  .how li b { font-weight: 500; display: block; }
  .how li span { color: var(--dim); font-size: 12.5px; }
  .how .note { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; display: flex; gap: 8px; }

  /* 범위 설정 */
  .cfg { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  .cfg .card + .card { margin-top: 16px; }
  .krow { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .krow .k { width: 64px; color: var(--muted); }
  .hint { padding: 10px 16px; color: var(--dim); font-size: 12.5px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .tree { padding: 6px 6px 8px; font-size: 13px; }
  .node { display: flex; align-items: center; gap: 6px; height: 30px; padding-right: 10px; padding-left: calc(var(--d) * 18px + 6px); border-radius: 6px; cursor: default; }
  .node:hover { background: var(--panel-2); }
  .node .tw { width: 16px; height: 16px; display: grid; place-items: center; color: var(--dim); border-radius: 4px; flex: none; }
  .node .tw svg { width: 12px; height: 12px; transition: transform .15s; }
  .node.open .tw svg { transform: rotate(90deg); }
  .node .tw:hover { color: var(--text); }
  .cb { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid #3a3d43; display: grid; place-items: center; flex: none; cursor: pointer; transition: background .1s, border-color .1s; }
  .cb:hover { border-color: var(--muted); }
  .cb.on, .cb.mixed { background: var(--text); border-color: var(--text); }
  .cb svg { width: 11px; height: 11px; stroke: var(--bg); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .node .fi { color: var(--dim); margin: 0 2px; }
  .node .fi.folder { color: var(--muted); }
  .node .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .nm.f { cursor: pointer; }
  .node .meta { margin-left: auto; color: var(--dim); font: 11.5px var(--mono); white-space: nowrap; padding-left: 12px; }
  .node.off .nm, .node.off .fi { color: var(--faint); }
  .node.ex .nm { color: var(--faint); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.12); }
  .node.ex .fi { color: var(--faint); }
  .node .exl { margin-left: auto; font-size: 11.5px; color: var(--faint); }
  .node.ex:hover .exl { color: var(--muted); }
  .sum { position: sticky; top: 0; padding: 20px; }
  .sum .big { font-size: 40px; font-weight: 500; letter-spacing: -.04em; line-height: 1; font-feature-settings: 'tnum'; }
  .sum .big small { font-size: 14px; letter-spacing: 0; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .kv { display: flex; justify-content: space-between; padding: 7px 0; color: var(--muted); font-size: 12.5px; }
  .kv b { color: var(--text); font-weight: 500; font-feature-settings: 'tnum'; }
  .div { height: 1px; background: var(--border); margin: 14px 0; }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
  .opt .grow { flex: 1; } .opt b { font-weight: 500; display: block; } .opt span { color: var(--dim); font-size: 12px; }
  .sw { width: 28px; height: 16px; border-radius: 999px; background: #2a2c31; position: relative; flex: none; margin-top: 2px; transition: background .15s; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--text); transition: transform .15s; }
  .sw.on { background: var(--green); } .sw.on::after { transform: translateX(12px); }
  .warn { margin-top: 10px; display: flex; gap: 8px; color: var(--amber); font-size: 12px; }

  /* 보고서 */
  .hero { display: flex; align-items: center; gap: 18px; margin-bottom: 28px; }
  .hero .fig { width: 60px; height: 56px; flex: none; }
  .hero h1 { font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
  .hero p { color: var(--muted); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .hero .sp { flex: 1; }
  .pr { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 12px; border-radius: 12px; border: 1px solid rgba(76,183,130,.25); background: linear-gradient(180deg, rgba(76,183,130,.08), rgba(76,183,130,.03)); max-width: 420px; }
  .pr .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr .s { color: var(--muted); font-size: 12px; display: flex; gap: 8px; }
  .rep { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
  .fl { position: sticky; top: 0; }
  .fl .lh { display: flex; align-items: center; gap: 10px; padding: 0 4px 10px; color: var(--muted); }
  .fitem { display: flex; gap: 11px; padding: 12px 12px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: background .12s, border-color .12s; }
  .fitem:hover { background: var(--panel); }
  .fitem.on { background: var(--panel); border-color: var(--border-2); }
  .fitem .cb { margin-top: 2px; }
  .fitem .grow { flex: 1; min-width: 0; }
  .fitem .t { font-weight: 500; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .fitem .t .sp { flex: 1; }
  .fitem .s { color: var(--dim); font: 11.5px var(--mono); margin-top: 3px; }
  .sev { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); font-weight: 400; }
  .safe { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  .safe > button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 4px; color: var(--muted); }
  .safe > button svg.c { margin-left: auto; transition: transform .15s; width: 12px; height: 12px; }
  .safe.open > button svg.c { transform: rotate(90deg); }
  .safe .srow { display: flex; gap: 8px; padding: 6px 4px 6px 6px; color: var(--muted); font-size: 12.5px; }
  .safe .srow .s { color: var(--dim); font: 11.5px var(--mono); margin-left: auto; }
  .det { padding: 22px 22px 24px; }
  .det .dh { display: flex; align-items: center; gap: 10px; }
  .det h3 { font-size: 18px; font-weight: 500; letter-spacing: -.015em; margin-top: 10px; }
  .det .desc { color: var(--muted); margin-top: 4px; font-size: 13.5px; }
  .det h4 { font-size: 12px; font-weight: 500; color: var(--dim); margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
  .det h4 .ln { flex: 1; height: 1px; background: var(--border); }
  .loc { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; }
  .proof { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .term { border-radius: 10px; border: 1px solid var(--border); background: #060708; overflow: hidden; display: flex; flex-direction: column; }
  .term .th { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .term .th .chip { margin-left: auto; }
  .term pre { padding: 12px; font: 12px/1.75 var(--mono); color: #c9ccd1; white-space: pre-wrap; word-break: break-all; flex: 1; }
  .term pre .m { color: var(--muted); }
  .term pre .r { color: var(--red); } .term pre .g { color: var(--green); }
  .term.bad { border-color: rgba(255,90,82,.22); }
  .term.good { border-color: rgba(76,183,130,.25); }

  S.cfg = { repo, branch, preset: 'rec', sel: new Set(), inc: new Set(), open: LIVE ? recOpen() : new Set(['src', 'src/app', 'src/app/api', 'src/app/api/users', 'src/app/api/orders', 'src/app/api/orders/[id]', 'src/lib']), verify: true, autoPr: false };
  applyPreset('rec');
}
/** 추천 파일이 보이도록 펼칠 폴더 */
function recOpen() {
  const open = new Set();
  // S.cfg 를 만드는 중에도 불리므로 기본 제외만 본다
  const ex = (n) => { for (let p = n; p; p = p.parent) if (p.x) return true; return false; };
  for (const l of ALL_LEAVES) if (l.t && !ex(l)) for (let p = l.parent; p; p = p.parent) open.add(p.path);
  return open;
}
function setTree(d) {
  fillArr(TREE_SRC, d.tree);
  fill(NODES, {});
  indexTree(TREE_SRC, null, 0);
  fillArr(ALL_LEAVES, TREE_SRC.flatMap(leaves));
  fillArr(BRANCHES, d.branches);
  // 브랜치를 바꿨으면 같은 설정으로 새 트리에서 다시 고른다
  if (S.cfg) { S.cfg.inc = new Set(); S.cfg.open = recOpen(); applyPreset(S.cfg.preset === 'custom' ? 'rec' : S.cfg.preset); }
}
function excluded(n) {
  for (let p = n; p; p = p.parent) if (p.x && !S.cfg.inc.has(p.path)) return p.x;
  return null;
}
function applyPreset(p) {
  const c = S.cfg;
  c.preset = p;
  if (p === 'custom') return;
  c.sel = new Set(ALL_LEAVES.filter((l) => !excluded(l) && (p === 'all' || l.t)).map((l) => l.path));
}
function boxState(n) {
  const ls = leaves(n).filter((l) => !excluded(l));
  const k = ls.filter((l) => S.cfg.sel.has(l.path)).length;
  return { k, total: ls.length, st: !ls.length || !k ? '' : k === ls.length ? 'on' : 'mixed' };
}
function cbEl(st, path) {
  return `<span class="cb ${st}" data-act="tick" data-v="${esc(path)}" role="checkbox" aria-checked="${st === 'on' ? 'true' : st === 'mixed' ? 'mixed' : 'false'}">${st === 'on' ? `<svg viewBox="0 0 16 16">${I.check}</svg>` : st === 'mixed' ? `<svg viewBox="0 0 16 16">${I.minus}</svg>` : ''}</span>`;
}
function treeRows(list) {
  return list.map((n) => {
    const ex = excluded(n);
    const ownEx = n.x && !S.cfg.inc.has(n.path);
    const folder = !isLeaf(n);
    const open = folder && S.cfg.open.has(n.path) && !ex;
    const { k, total, st } = boxState(n);
    const cls = ['node', open ? 'open' : '', ex ? 'ex' : '', !ex && !st ? 'off' : ''].join(' ');
    const meta = ex
      ? (ownEx ? `<span class="exl">${ex} · 제외됨</span>` : '')
      : folder ? `<span class="meta">${k}/${total}</span>` : `<span class="meta">${n.files ? `${n.files.toLocaleString()}개 파일` : n.l ? `${n.l}줄` : ''}</span>`;
    const row = `<div class="${cls}" style="--d:${n.d}">
      <span class="tw" ${folder && !ex ? `data-act="fold" data-v="${esc(n.path)}"` : ''}>${folder && !ex ? `<svg class="i" viewBox="0 0 16 16">${I.chev}</svg>` : ''}</span>
      ${cbEl(ex ? '' : st, n.path)}
      <span class="fi ${folder || n.files ? 'folder' : ''}">${ic(folder || n.files ? 'folder' : 'file')}</span>
      <span class="nm ${folder ? 'f' : ''}" ${folder && !ex ? `data-act="fold" data-v="${esc(n.path)}"` : `data-act="tick" data-v="${esc(n.path)}"`}>${esc(n.n)}</span>
      ${!ex && n.t ? n.t.map((t) => `<span class="tag">${t}</span>`).join('') : ''}
      ${meta}
    </div>`;
    return row + (open ? treeRows(n.c) : '');
  }).join('');
}

  return `<div class="big">${files.toLocaleString()}<small>개 파일</small></div>
    <div style="margin-top:14px">
      <div class="kv"><span>코드</span><b>${lines.toLocaleString()}줄</b></div>

    <div class="div"></div>

function startBoot() {
  const c = S.cfg;
  const files = ALL_LEAVES.filter((l) => c.sel.has(l.path) && !excluded(l)).reduce((n, l) => n + (l.files ?? 1), 0);
  const items = [`${c.branch} 브랜치 받기`, `${files}개 파일 준비`, c.verify ? '공격용 샌드박스 띄우기' : '분석기 준비'];
  const el = document.createElement('div');
  el.className = 'boot';
  let err = '';
  const draw = (k) => el.innerHTML = `<div class="fig">${char('sniff')}</div><h2>${c.repo}</h2>
    <ul>${items.map((t, i) => `<li class="${i < k ? 'ok' : i === k ? 'on' : ''}"><span class="s">${i < k ? `<span class="green">${ic('check')}</span>` : i === k ? '<span class="spin"></span>' : '<span class="o"></span>'}</span>${t}</li>`).join('')}</ul>
    <div class="foot">${err ? `<span class="red">${esc(err)}</span> · 눌러서 닫기` : k >= items.length ? '스캔 화면으로 이동해요…' : `${c.repo} · ${c.branch}`}</div>`;
  document.body.append(el);
  const go = LIVE
    ? fetch('/api/app/scans', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repo: c.repo, branch: c.branch }) })
      .then(async (res) => { if (!res.ok) throw new Error((await res.text()) || '스캔을 시작하지 못했어요'); return scanUrl(c.repo, c.branch, (await res.json()).id); })
    : Promise.resolve(scanUrl(c.repo, c.branch));
  go.catch((e) => { clearInterval(t); err = e.message || '스캔 서버에 연결할 수 없어요'; draw(k); });
  let k = 0; draw(0);
  const t = setInterval(() => {
    draw(++k);
    if (k > items.length) {
      clearInterval(t);
      go.then((url) => location.href = url, () => {});
    }
  }, 750);
  el.addEventListener('click', () => { clearInterval(t); el.remove(); });
}

// ───────── 4. 스캔 보고서 — 증명이 주인공 ─────────
function repInit(id) {
  if (S.rep[id]) return S.rep[id];
  const s = SCANS[id];
  return S.rep[id] = { sel: new Set(s.findings), active: s.findings?.[0], fixing: null };
}
function evidence(e, after) {
  const blocked = after && e.ok !== false;
  const chip = (good) => `<span class="chip ${good ? 'green' : 'red'}">${good ? '막힘' : '뚫림'}${e.note ? ` · ${e.note}` : e.status ? ` ${e.status}` : ''}</span>`;
  const head = `<div class="th">${after ? '고친 뒤 · 같은 공격' : '고치기 전 · 공격'}${chip(blocked)}</div>`;
  if (e.kind === 'log') {
    return `<div class="term ${blocked ? 'good' : 'bad'}">${head}<pre>${e.lines.map((l, i) => i === 0 ? `<span class="m">${esc(l)}</span>` : `<span class="${blocked ? 'g' : 'r'}">${esc(l)}</span>`).join('\n')}</pre></div>`;
  }
  return `<div class="term ${blocked ? 'good' : 'bad'}">${head}<pre><span class="m">${e.method}</span> ${esc(e.url)}${e.body ? `\n<span class="m">body</span> ${esc(e.body)}` : ''}${e.who ? `\n<span class="m">as</span>   ${e.who}` : ''}
<span class="${blocked ? 'g' : 'r'}">→ ${e.status}</span>${e.res ? `  ${esc(e.res)}` : ''}</pre>${e.reason ? `<div class="reason">${ic('check', 'green')}<span>${esc(e.reason)}</span></div>` : ''}</div>`;
}
function diffEl(f) {
  if (!f.diff?.length) return `<div class="term wait"><pre>고치기를 누르면 수정안을 만들어요</pre></div>`;
  const adds = f.diff.filter((d) => d[0] === '+').length, dels = f.diff.filter((d) => d[0] === '-').length;
  const bar = Array.from({ length: 5 }, (_, i) => `<i class="${i < Math.round(5 * adds / (adds + dels)) ? 'a' : i < 5 ? 'd' : ''}"></i>`).join('');
  return `<div class="diff"><div class="dh">${esc(f.path)}<span class="green">+${adds}</span><span class="red">−${dels}</span><span class="bar">${bar}</span></div>
    <div class="db"><div>${f.diff.map((d) => d[0] === 'h'
      ? `<div class="dl hunk"><span></span><span></span><em></em><code>${esc(d[1])}</code></div>`
      : `<div class="dl ${d[0] === '+' ? 'add' : d[0] === '-' ? 'del' : ''}"><span>${d[1] || ''}</span><span>${d[2] || ''}</span><em>${d[0] === ' ' ? '' : d[0] === '-' ? '−' : '+'}</em><code>${esc(d[3])}</code></div>`).join('')}</div></div>
  </div>`;
}

          <span>취약점 ${s.findings.length}</span><span class="dim">· Critical ${crit} · High ${s.findings.length - crit}</span>

        </div>` : ''}

        </div>
        <h4>${isFixed ? '적용된 수정' : '제안된 수정'}<span class="ln"></span></h4>

async function runFix(id) {
  if (LIVE) return runFixLive(id);
  const s = SCANS[id], st = S.rep[id];
  const todo = s.findings.filter((x) => st.sel.has(x));
  s.status = 'fixing'; s.fixed = [];
  render();
  for (const x of todo) {
    st.fixing = x; st.active = x; render();
    await new Promise((r) => setTimeout(r, 1100));
    s.fixed.push(x); st.fixing = null; render();
    await new Promise((r) => setTimeout(r, 350));
  }
  s.status = 'done';
  s.pr = { n: 24, title: `fix(security): ${F[todo[0]].title}${todo.length > 1 ? ` 외 ${todo.length - 1}건` : ''} 수정`, add: todo.reduce((n, x) => n + F[x].diff.filter((d) => d[0] === '+').length, 0), del: todo.reduce((n, x) => n + F[x].diff.filter((d) => d[0] === '-').length, 0), files: new Set(todo.map((x) => F[x].path)).size, merged: false };
  render();
}
// 선택한 취약점마다 백엔드에 수정안을 요청해 받아 오고, 받은 수정안으로 PR 을 연다
async function runFixLive(id) {
  const s = SCANS[id], st = S.rep[id];
  const todo = s.findings.filter((x) => st.sel.has(x));
  const num = id.slice(2);
  liveBusy = true; S.err = '';
  s.status = 'fixing'; s.fixed = [];
  render();
  const fixIds = [];
  // 수정안은 한꺼번에 요청해 두고, 화면에서는 하나씩 받아 보여 준다
  await Promise.all(todo.filter((x) => F[x].fixId === undefined).map((x) => fetch(`/api/v1/findings/${x.slice(2)}/fixes`, { method: 'POST' }).catch(() => {})));
  // 백엔드는 고칠 수 없는 취약점에는 수정안을 끝내 만들지 않는다. 전체 90초, 하나라도 받은 뒤로는 20초까지만 기다린다
  const until = Date.now() + 90000;
  let lastArrival = 0;
  for (const x of todo) {
    st.fixing = x; st.active = x; render();
    try {
      while (F[x].fixId === undefined && Date.now() < until && !(lastArrival && Date.now() - lastArrival > 20000)) {
        await sleep(2000);
        const res = await fetch(`/api/app/findings/${x.slice(2)}`);
        if (res.ok) F[x] = await res.json();
      }
      if (F[x].fixId !== undefined) { fixIds.push(F[x].fixId); s.fixed.push(x); lastArrival = Date.now(); }
    } catch {}
    st.fixing = null; render();
    await sleep(350);
  }
  const fail = (msg) => { s.status = 'scanned'; delete s.fixed; S.err = msg; liveBusy = false; render(); };
  if (!fixIds.length) return fail('수정안을 만들지 못했어요');
  let pr;
  try {
    const res = await fetch(`/api/v1/scans/${num}/pull-requests`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fix_ids: fixIds }) });
    if (!res.ok) throw new Error();
    pr = await res.json();
    for (const until = Date.now() + 90000; pr.status === 'pending' && Date.now() < until;) {
      await sleep(2500);
      pr = (await fetch(`/api/v1/scans/${num}/pull-requests`).then((r) => r.json()).catch(() => [])).find((p) => p.id === pr.id) ?? pr;
    }
  } catch {}
  if (pr?.status !== 'created') return fail(pr?.status === 'pending' ? 'PR 이 아직 만들어지는 중이에요' : 'PR 을 열지 못했어요');
  const rows = s.fixed.flatMap((x) => F[x].diff);
  s.status = 'done';
  s.pr = { n: pr.pr_number, title: `fix(security): ${F[s.fixed[0]].title}${s.fixed.length > 1 ? ` 외 ${s.fixed.length - 1}건` : ''} 수정`, add: rows.filter((d) => d[0] === '+').length, del: rows.filter((d) => d[0] === '-').length, files: new Set(s.fixed.map((x) => F[x].path)).size, merged: false, url: pr.pr_url };
  liveBusy = false;
  render();
}
function legacyScan(id) {
  const s = SCANS[id];
  if (!s) return notFound();
  // 아직 도는 스캔은 스캔 연출 화면에서 본다
  if (LIVE && (s.status === 'queued' || s.status === 'scanning')) setTimeout(() => location.href = scanUrl(s.repo, s.branch, id.slice(2)));
  const r = repoBy(s.repo);
  return frame(s.repo, `<a href="#/">홈</a><span class="sep">/</span><a href="#/repo/${s.repo}">${r.name}</a><span class="sep">/</span><b class="mono" style="font-weight:400;font-size:12.5px">${id}</b>`,
    `<div class="wrap page"><div class="card empty" style="padding:56px 16px"><div class="fig" style="width:64px;height:60px">${char(s.status === 'failed' ? 'idle' : 'happy')}</div>
      <h2 style="font-size:16px">${s.status === 'failed' ? esc(s.msg) : foundOf(s) ? `${fixedOf(s)}개를 고쳤어요` : '문제를 찾지 못했어요'}</h2>
      <span class="dim">${s.branch} · ${s.scope} · ${s.ago}</span>
      <a class="btn sm" href="#/new/${s.repo}" style="margin-top:6px">다시 스캔</a></div></div>`);
}

// ───────── 5. 레포 상세 (Vercel Deployments) ─────────
function repoPage(repoFull) {
  const r = repoBy(repoFull);
  if (!r) return notFound();
  const scans = Object.entries(SCANS).filter(([, s]) => s.repo === repoFull);
  const s0 = latest(r);
  const openF = s0?.status === 'scanned' ? s0.findings : s0?.findings ? s0.findings.filter((x) => !(s0.fixed ?? []).includes(x)) : [];
  const prs = scans.filter(([, s]) => s.pr);
  const tabs = [['scans', '스캔 기록', scans.length], ['open', '열린 취약점', openF.length], ['prs', 'PR', prs.length]];
  let body;
  if (S.tab === 'open') {
    body = openF.length ? `<div class="list">${openF.map((x) => `<a class="row" href="#/scan/${r.last}"><span class="ico red">${ic('bug')}</span><div class="grow"><div class="t">${esc(F[x].title)}</div><div class="s mono" style="font-size:11.5px">${esc(F[x].path)}:${F[x].line}</div></div><span class="chip red">뚫림</span></a>`).join('')}</div>`
      : `<div class="list"><div class="empty"><div class="fig" style="width:52px;height:48px">${char('happy')}</div>열린 취약점이 없어요</div></div>`;
  } else if (S.tab === 'prs') {
    body = prs.length ? `<div class="list">${prs.map(([id, s]) => `<a class="row" href="#/scan/${id}"><span class="ico green">${ic('pr')}</span><div class="grow"><div class="t">#${s.pr.n} ${esc(s.pr.title ?? `fix(security): ${fixedOf(s)}건 수정`)}</div><div class="s">${s.ago} · ${fixedOf(s)}개 고침</div></div><span class="chip ${s.pr.merged ? 'gray' : 'green'}">${s.pr.merged ? '머지됨' : '열림'}</span></a>`).join('')}</div>`
      : `<div class="list"><div class="empty">아직 PR 이 없어요</div></div>`;
  } else {
    body = scans.length ? `<div class="list hist">${scans.map(([id, s]) => `<div class="tr" data-act="go" data-v="#/scan/${id}">
        <span>${statusEl(s)}</span>
        <div style="min-width:0"><div class="id">${id}</div><div class="sub">${s.scope}</div></div>
        <span class="br c-br">${ic('branch')}${s.branch}<span class="dim">@${s.commit}</span></span>
        <span class="c-res" style="font-size:12.5px">${s.status === 'failed' ? `<span class="dim">${esc(s.msg)}</span>` : `${foundOf(s)} 발견 <span class="dim">·</span> <span class="${fixedOf(s) ? 'green' : 'dim'}">${fixedOf(s)} 막음</span>`}</span>
        <span class="dim c-dur" style="text-align:right;font-size:12.5px">${s.ago}</span>
      </div>`).join('')}</div>`
      : `<div class="list"><div class="empty"><div class="fig" style="width:56px;height:52px">${char('idle')}</div>아직 스캔한 적이 없어요<a class="btn sm primary" href="#/new/${repoFull}" style="margin-top:4px">첫 스캔 시작</a></div></div>`;
  }
  return frame(repoFull, `<a href="#/">홈</a><span class="sep">/</span><b>${r.name}</b>`, `<div class="wrap page">
    <div class="head"><div>
      <h1 style="display:flex;align-items:center;gap:10px"><span class="muted" style="font-weight:400">${r.ws} /</span> ${r.name}${r.private ? '<span class="private">Private</span>' : ''}</h1>
      <p style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${r.desc ? `<span>${esc(r.desc)}</span>` : ''}<span class="lang"><i style="background:${LANG[r.lang]}"></i>${r.lang}</span><span class="br">${ic('branch')}${r.branch}</span><span class="dim">${r.pushed} 푸시</span></p>
    </div><span class="sp"></span>
      <a class="btn" href="https://github.com/${esc(repoFull)}" target="_blank" rel="noopener">${ghIcon}GitHub</a>
      <a class="btn primary" href="#/new/${repoFull}">${ic('scan')}새 스캔</a>
    </div>
    <div class="tabs">${tabs.map(([v, l, n]) => `<button class="${S.tab === v ? 'on' : ''}" data-act="tab" data-v="${v}">${l}<span class="dim">${n}</span></button>`).join('')}</div>
    ${body}
  </div>`);
}
function notFound() {
  return frame('', '', `<div class="wrap"><div class="empty"><div class="fig" style="width:56px;height:52px">${char('idle')}</div>찾을 수 없어요<a class="btn sm" href="#/">홈으로</a></div></div>`);
}

// ───────── ⌘K ─────────
function palItems() {
  const q = S.pal.q.trim().toLowerCase();
  const acts = [
    { g: '동작', label: '새 스캔', icon: 'plus', href: '#/new', kbd: 'N' },
    { g: '동작', label: '홈', icon: 'home', href: '#/' },
    { g: '동작', label: '스캔 데모 열기 (기존)', icon: 'play', href: '/demo' },
  ];
  const repos = REPOS.map((r) => ({ g: '레포', label: full(r), icon: 'repo', href: `#/repo/${full(r)}`, lang: r.lang }));
  return [...acts, ...repos].filter((x) => x.label.toLowerCase().includes(q));
}
function palette() {
  if (!S.pal.open) return '';
  return `<div class="ov" data-act="palclose"><div class="pal" data-stop>
    <div class="pi">${ic('scan')}<input id="pq" placeholder="레포로 이동하거나 동작 실행…" value="${esc(S.pal.q)}" autocomplete="off"></div>
    <div class="pl" id="pl">${palList()}</div>
    <div class="pf"><span><kbd>↑↓</kbd> 이동</span><span><kbd>↵</kbd> 열기</span><span><kbd>esc</kbd> 닫기</span></div>
  </div></div>`;
}
function palList() {
  const items = palItems();
  if (!items.length) return `<div class="empty" style="padding:24px">결과가 없어요</div>`;
  S.pal.i = Math.min(S.pal.i, items.length - 1);
  let g = '';
  return items.map((x, i) => (x.g !== g ? `<h6>${(g = x.g)}</h6>` : '') + `<div class="it ${i === S.pal.i ? 'on' : ''}" data-act="palgo" data-v="${x.href}">${x.lang ? `<span class="lang" style="width:16px;justify-content:center"><i style="background:${LANG[x.lang]}"></i></span>` : ic(x.icon)}${esc(x.label)}${x.kbd ? `<kbd>${x.kbd}</kbd>` : ''}</div>`).join('');
}

// ───────── 라우터 · 이벤트 ─────────
const app = document.getElementById('app');
function route() {
  const [, page, ...rest] = (location.hash || '#/').slice(1).split('/');
  const arg = rest.join('/');
  if (!page) return dashboard();
  if (page === 'new') return arg ? configPage(arg) : importPage();
  if (page === 'repo') return repoPage(arg);
  if (page === 'scan') return reportPage(arg);
  return notFound();
}
function render() {
  const y = document.getElementById('scroll')?.scrollTop ?? 0;
  const same = render.last === location.hash;
  app.innerHTML = route() + palette();
  if (same) document.getElementById('scroll').scrollTop = y;
  // 같은 화면 안의 다시 그리기에서는 등장 애니메이션을 끈다
  if (same) app.querySelectorAll('.page > *').forEach((el) => el.style.animation = 'none');
  render.last = location.hash;
  refreshLive();
  if (S.pal.open) { const i = document.getElementById('pq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
window.addEventListener('hashchange', () => { S.menu = null; S.tab = 'scans'; S.safeOpen = false; S.err = ''; render(); });

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (S.menu && !e.target.closest('.pick')) { S.menu = null; render(); }
  if (!t) return;
  if (e.target.closest('[data-stop]') && t.dataset.act === 'go') return;
  if (t.dataset.act === 'palclose' && e.target.closest('.pal')) return;
  const v = t.dataset.v, v2 = t.dataset.v2;
  const A = {
    noop: () => e.preventDefault(),
    go: () => location.hash = v,
    menu: () => { S.menu = S.menu === v ? null : v; render(); },
    ws: () => { S.ws = v; S.menu = null; render(); },
    filter: () => { S.filter = v; document.getElementById('rows').innerHTML = repoRows(); document.querySelectorAll('[data-act=filter]').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); },
    pal: () => { S.pal = { open: true, q: '', i: 0 }; render(); },
    palclose: () => { S.pal.open = false; render(); },
    palgo: () => { S.pal.open = false; v.startsWith('#') ? (location.hash === v ? render() : location.hash = v) : window.open(v, '_blank'); render(); },
    branch: () => { S.cfg.branch = v; S.menu = null; render(); },
    preset: () => { applyPreset(v); render(); },
    fold: () => { const o = S.cfg.open; o.has(v) ? o.delete(v) : o.add(v); render(); },
    foldall: () => { const c = S.cfg; c.open = c.open.size > 4 ? new Set() : new Set(Object.values(NODES).filter((n) => n.c).map((n) => n.path)); render(); },
    tick: () => {
      const c = S.cfg, n = NODES[v];
      const ex = excluded(n);
      if (ex) { for (let p = n; p; p = p.parent) if (p.x) c.inc.add(p.path); leaves(n).forEach((l) => c.sel.add(l.path)); }
      else { const on = boxState(n).st === 'on'; leaves(n).filter((l) => !excluded(l)).forEach((l) => on ? c.sel.delete(l.path) : c.sel.add(l.path)); }
      c.preset = 'custom'; render();
    },
    opt: () => { S.cfg[v] = !S.cfg[v]; document.getElementById('sum').innerHTML = cfgSummary(); },
    start: () => startBoot(),
    tab: () => { S.tab = v; render(); },
    pickf: () => { S.rep[v2].active = v; render(); },
    self: () => { e.stopPropagation(); const s = S.rep[v2].sel; s.has(v) ? s.delete(v) : s.add(v); render(); },
    selall: () => { const st = S.rep[v2]; st.sel = st.sel.size === SCANS[v2].findings.length ? new Set() : new Set(SCANS[v2].findings); render(); },
    fix: () => runFix(v),
    safe: () => { S.safeOpen = !S.safeOpen; render(); },
  };
  A[t.dataset.act]?.();
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; document.getElementById('rows').innerHTML = repoRows(); }
  if (e.target.id === 'iq') { S.iq = e.target.value; document.getElementById('irows').innerHTML = importRows(); }
  if (e.target.id === 'pq') { S.pal.q = e.target.value; S.pal.i = 0; document.getElementById('pl').innerHTML = palList(); }
});
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.pal = { open: !S.pal.open, q: '', i: 0 }; return render(); }
  if (S.pal.open) {
    const items = palItems();
    if (e.key === 'Escape') { S.pal.open = false; return render(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.pal.i = (S.pal.i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length; document.getElementById('pl').innerHTML = palList(); return; }
    if (e.key === 'Enter' && items[S.pal.i]) { document.querySelector('.it.on')?.click(); }
    return;
  }
  if (e.key === 'Escape' && S.menu) { S.menu = null; return render(); }
  if (typing) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (e.key === 'n' || e.key === 'N') location.hash = '#/new';
  if (e.key === '/') { const q = document.getElementById('q') || document.getElementById('iq'); if (q) { e.preventDefault(); q.focus(); } }
});

if (LIVE) {
  app.innerHTML = `<div class="boot" style="position:fixed"><div class="fig">${char('sniff')}</div><div class="foot">레포를 불러오는 중…</div></div>`;
  loadLive().then(render, (e) => {
    app.innerHTML = `<div class="boot" style="position:fixed"><div class="fig">${char('idle')}</div><div class="foot"><span class="red">${esc(e.message)}</span> · <a href="/dashboard">다시 시도</a></div></div>`;
  });
} else render();
</script>
